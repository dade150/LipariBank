<header class="header">
  <div class="header__left">
    <!-- Hamburger visibile solo su mobile -->
    <button
      class="app-shell__hamburger d-md-none"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#sidebarOffcanvas"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="header__logo-circle">LB</div>
    <div class="header__branding">
      <span class="header__title">Lipari Bank</span>
      <span class="header__subtitle">Client Dashboard</span>
    </div>
  </div>

  <div class="header__right">
    <app-notification-bell></app-notification-bell>

    <button class="header__logout" *ngIf="isAuthenticated" type="button">
      Logout
    </button>
  </div>
</header>
