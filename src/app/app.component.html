<!-- ── MOBILE: hamburger button (Bootstrap Offcanvas trigger) ──────────────────
     Visibile solo su schermi piccoli (d-flex d-md-none).
     Posizionato fuori dall'header per semplicità; puoi spostarlo dentro HeaderComponent se preferisci. -->
<button
  class="app-shell__hamburger d-flex d-md-none"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#sidebarOffcanvas"
  aria-controls="sidebarOffcanvas"
  aria-label="Apri menu">
  <span class="navbar-toggler-icon"></span>
</button>

<!-- ── MOBILE: sidebar come Offcanvas Bootstrap ───────────────────────────────
     Si apre da sinistra, si chiude con la X o cliccando fuori.
     Visibile solo su mobile (nascosto su md+). -->
<div
  class="offcanvas offcanvas-start d-md-none"
  tabindex="-1"
  id="sidebarOffcanvas"
  aria-labelledby="sidebarOffcanvasLabel"
  style="width: 280px; background: #0b2340;">
  <div class="offcanvas-header border-bottom border-white border-opacity-10">
    <span id="sidebarOffcanvasLabel" class="text-white fw-semibold">Lipari Bank</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Chiudi"></button>
  </div>
  <div class="offcanvas-body p-0">
    <!-- Stesso componente sidebar: su mobile lo wrappa Bootstrap, su desktop è fisso -->
    <app-sidebar
      [userName]="userName()"
      (sectionSelected)="onSectionChange($event)" />
  </div>
</div>

<!-- ── DESKTOP: layout shell principale ───────────────────────────────────── -->
<main class="app-shell">
  <div class="app-shell__header">
    <app-header [isAuthenticated]="isAuthenticated()"></app-header>
  </div>

  <!-- Sidebar desktop: sempre visibile su md+, nascosta su mobile -->
  <aside class="app-shell__sidebar d-none d-md-block">
    <app-sidebar
      [userName]="userName()"
      (sectionSelected)="onSectionChange($event)" />
  </aside>

  <section class="app-shell__main">
    <div class="app-shell__welcome">
      <span class="app-shell__welcome-label">Benvenuto,</span>
      <span class="app-shell__welcome-name">{{ userName() }}</span>
    </div>
    <router-outlet></router-outlet>
  </section>

  <footer class="app-shell__footer">
    <app-footer></app-footer>
  </footer>
</main>
